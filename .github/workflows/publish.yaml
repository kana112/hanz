name: publish
on:
  pull_request:
    branches:
      - main
    types: [closed]

jobs:
  setup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # runs only the branch name starts with 'release/v' and the pull request is merged.
    if: startsWith(github.head_ref, 'releases/v') && github.event.pull_request.merged == true
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    steps:
      - name: Git Tag name
        id: vars
        run: |
          echo "tag=${GITHUB_HEAD_REF##*/v}" >> $GITHUB_OUTPUT
    
      - name: Create release
        id: create_release
        uses: actions/create-release@v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.vars.outputs.tag }}
          release_name: Release v${{ steps.vars.outputs.tag }}
          draft: true
          prerelease: false

  publish_linux:
    runs-on: ubuntu-latest
    needs: setup
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0 # Fetch all history for .GitInfo and .Lastmod

      - name: Create Linux distribution files
        env:
          TAG: ${{ needs.setup.outputs.tag }}
        run: |
          set -eu
          product_name=hanz
          release="$product_name-$TAG-amd64-linux"
          mkdir -p "dist/$release"
          cargo build --release
          cp LICENSE README.md "target/release/$product_name" "dist/$release/"
          tar cvfz "dist/$release.tar.gz" -C dist "$release"

      - name: Upload Linux assets
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          UPLOAD_URL: ${{ needs.setup.outputs.upload_url }}
        run: |
          sh .github/scripts/upload_assets.sh ${{ needs.setup.outputs.tag }}

  publish_macos:
    runs-on: macos-latest
    needs: setup
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Create macOS distribution files
        run: sh .github/scripts/make_distribution_files.sh "${{ needs.setup.outputs.tag }}"

      - name: Upload macOS assets
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          UPLOAD_URL: ${{ needs.setup.outputs.upload_url }}
        run: |
          sh .github/scripts/upload_assets.sh ${{ needs.setup.outputs.tag }}

  container_image:
    runs-on: ubuntu-latest
    needs: [publish_linux, publish_macos]
    permissions:
      contents: read
    steps:
      - name: Setup just
        uses: extractions/setup-just@v4

      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push container image
        run: just container

  finalize:
    runs-on: ubuntu-latest
    needs: [setup, publish_linux, publish_macos, container_image]
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Finalize release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit v${{ needs.setup.outputs.tag }} --draft=false
